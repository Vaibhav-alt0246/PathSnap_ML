[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap-ml"
version = "0.1.0"
description = "GPS map matching with machine learning and road-network inference"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
